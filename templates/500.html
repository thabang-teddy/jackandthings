<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something broke · Jack &amp; Things</title>
    <style>
      :root { --bg:#F5F2EA; --text:#17191E; --muted:#5A5D64; --accent:#1F4FD1; --line:#DDD6C7; }
      @media (prefers-color-scheme: dark) { :root { --bg:#121417; --text:#ECE6DA; --muted:#A39D91; --accent:#86A8FF; --line:#30353E; } }
      body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
      main { max-width:560px; margin:12vh auto; padding:0 24px; }
      p.k { font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); border-top:2px solid var(--text); padding-top:10px; }
      h1 { font-family:Georgia, serif; font-weight:500; font-size:44px; line-height:1.1; margin:8px 0 16px; }
      a { color:var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <p class="k">Error 500</p>
      <h1>Something broke on our side.</h1>
      <p>It's been logged and the owner has been emailed. Your data is safe. Try again in a minute.</p>
      <p><a href="/">Back to Today</a></p>
    </main>
  </body>
</html>
