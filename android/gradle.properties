org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 compatibility, carried over as a set from ../../giwubible/kotlin, which
# builds with this same AGP/Kotlin pair. The important one is builtInKotlin:
# AGP 9 ships its own Kotlin support and rejects the standalone
# org.jetbrains.kotlin.android plugin unless that is turned off, and the
# standalone plugin is what the compose and serialization plugins attach to.
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
