[project]
name = "jackandthings"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "DJ001"]  # assert is fine in tests; CharField(null) isn't used

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "S105"]
"**/migrations/*" = ["E501", "I001"]  # Django writes these files, not us
"**/tests/*" = ["S105", "S106"]  # test passwords

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
