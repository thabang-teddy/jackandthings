[project]
name = "jackandthings"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
# The browser journeys need built assets and a browser, so they are opt-in:
#   pytest tests_e2e --ds=config.settings.e2e -m e2e
addopts = "-q -m 'not e2e'"
markers = ["e2e: drives a real browser against a live server (see tests_e2e/)"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101", "DJ001"]  # assert is fine in tests; CharField(null) isn't used

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405", "S105"]
"**/migrations/*" = ["E501", "I001"]  # Django writes these files, not us
"**/tests/*" = ["S105", "S106"]  # test passwords
"tests_e2e/*" = ["S105", "S106"]  # the journeys' own throwaway account

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
