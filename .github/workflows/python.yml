# Jack & Things — the Python app (django/).
#
# Three checks, then one publisher:
#
#   backend    ruff, Django's own system check, a migration-drift check and the
#              fast pytest suite (unit, service, ownership and api/v1).
#   frontend   tsc --noEmit and the Vite build. static/dist is git-ignored, so
#              this job is the only thing that produces the bundle the server
#              serves — and the only thing that proves it still compiles.
#   journeys   The twelve Playwright journeys: a real browser signing in and
#              using the app against a live server running the built bundle.
#              It needs the bundle, so it waits for `frontend` and reuses its
#              artefact rather than building it twice.
#   publish    Flattens django/ onto an artefact branch with the built assets
#              committed, once every check above has passed in THIS run.
#
# Pull requests run the three checks. Pushes to main, staging and dev run them
# and then publish:
#
#   main              -> deploy/python
#   staging, dev      -> deploy/python-staging
#
# "The pull request was green" is not something a workflow can act on, which is
# why the publisher depends on the checks directly.
#
# Nothing here uses continue-on-error. A check that cannot fail the build is not
# a check.

name: Python app

on:
  pull_request:
    branches: [main, staging, dev]
    paths: ['django/**', '.github/workflows/python.yml']
  push:
    branches: [main, staging, dev]
    paths: ['django/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # GoDaddy's Python Selector offers 3.11, and pyproject pins >=3.11,<3.12.
  # Testing on anything else would be testing a server that does not exist.
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

defaults:
  run:
    working-directory: django

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend — ruff, checks, migrations, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: django/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Django system check
        run: python manage.py check --settings=config.settings.test

      # Models and migrations drifting apart is a deployment failure waiting to
      # happen: the server migrates, the code expects another column.
      - name: Migrations are up to date with the models
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

      - name: Tests
        run: pytest

  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: django/frontend/package-lock.json

      - name: Install dependencies
        working-directory: django/frontend
        run: npm ci

      # `npm run build` is tsc --noEmit && vite build: a type error fails here.
      - name: Build
        working-directory: django/frontend
        run: npm run build

      - name: Keep the bundle for the journeys and the publisher
        uses: actions/upload-artifact@v4
        with:
          name: django-static-dist
          path: django/static/dist
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  journeys:
    name: Journeys — Playwright against a live server
    runs-on: ubuntu-latest
    timeout-minutes: 25

    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: django/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The journeys load the built bundle, exactly as a deployment would.
      - name: Take the bundle from the frontend job
        uses: actions/download-artifact@v4
        with:
          name: django-static-dist
          path: django/static/dist

      - name: Install the browser
        run: python -m playwright install --with-deps chromium

      # --screenshot/--tracing only write anything when a journey fails, and that
      # is what the artefact below picks up.
      - name: Walk the journeys
        run: >
          pytest tests_e2e --ds=config.settings.e2e -m e2e
          --screenshot=only-on-failure --tracing=retain-on-failure

      # A failed journey is much easier to read as a picture.
      - name: Keep the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journey-failures
          path: django/test-results
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The deploy branch.
  #
  # deploy/python and deploy/python-staging are ARTEFACTS, force-pushed by this
  # job and never written by hand. They hold the Django app at the branch root
  # with static/dist committed (source ignores it), no tests, no frontend
  # sources and no node_modules — what Passenger needs and nothing else.
  #
  # Never open a pull request from one of them: they would delete laravel/,
  # android/, extension/ and docs/ from the target branch.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish the deploy branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # THE GATE. Without this edge this is a deployment pipeline with no tests in
    # front of it.
    needs: [backend, frontend, journeys]

    # The `push` clause is not decoration: without it a pull request targeting
    # main would publish the pull request's head as production.
    if: |
      github.event_name == 'push'
      && contains(fromJSON('["main", "staging", "dev"]'), github.ref_name)

    # Two pushes a minute apart must not interleave their force-pushes, and a
    # half-published artefact is worse than a slow one, so this is not cancelled
    # in flight.
    concurrency:
      group: python-publish-${{ github.ref_name }}
      cancel-in-progress: false

    # Overrides the workflow-level `contents: read`. Force-pushing the artefact
    # branch is the only write this pipeline performs.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve the target branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "DEPLOY_BRANCH=deploy/python"         >> "$GITHUB_ENV"
            echo "ENVIRONMENT=production"              >> "$GITHUB_ENV"
          else
            echo "DEPLOY_BRANCH=deploy/python-staging" >> "$GITHUB_ENV"
            echo "ENVIRONMENT=staging"                 >> "$GITHUB_ENV"
          fi
          echo "RELEASE_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Take the bundle from the frontend job
        uses: actions/download-artifact@v4
        with:
          name: django-static-dist
          path: django/static/dist

      # Flatten django/ onto the branch root and drop every other surface.
      #
      # dotglob is load-bearing: .env.example and .gitignore have to move, and a
      # plain `mv django/*` would leave them behind. `.git` is excluded from the
      # sweep because deleting it would delete the branch being built.
      #
      # `git add -Af static/dist` is required precisely BECAUSE the .gitignore
      # that just moved to the root excludes it.
      - name: Publish the artefact branch
        working-directory: .
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf django/frontend django/tests_e2e django/.venv
          find django/apps -type d -name tests -prune -exec rm -rf {} +
          rm -f django/conftest.py django/requirements-dev.txt django/pyproject.toml

          # scripts/deploy.sh drives a server from a workstation and runs ruff
          # and pytest, neither of which is on this branch. The script that
          # belongs here is scripts/cpanel_update.sh, which runs on the server.
          rm -f django/scripts/deploy.sh

          git checkout -B "$DEPLOY_BRANCH"

          shopt -s dotglob nullglob
          for entry in *; do
            case "$entry" in
              django|.git) ;;
              *) rm -rf "$entry" ;;
            esac
          done

          mv django/* .
          rmdir django

          git add -Af static/dist
          git add -A
          git commit -m "build ${RELEASE_SHA} for ${ENVIRONMENT} from ${GITHUB_SHA}"
          git push --force origin "$DEPLOY_BRANCH"

      - name: Summarise
        working-directory: .
        run: |
          {
            echo "### Python artefact published for ${ENVIRONMENT}"
            echo
            echo "- Source: \`${{ github.ref_name }}\` @ \`${RELEASE_SHA}\`"
            echo "- Artefact branch: \`${DEPLOY_BRANCH}\` (the Django app at the branch root)"
            echo "- Contains: apps/, config/, templates/, static/ with the built bundle,"
            echo "  manage.py, passenger_wsgi.py, requirements.txt, scripts/"
            echo
            echo "**Not deployed.** Nothing polls this branch. To put it live, on the"
            echo "server: \`cd ~/jackandpy && bash scripts/cpanel_update.sh\` — it"
            echo "fetches this branch, backs up, migrates, collects static files,"
            echo "runs check --deploy and restarts Passenger. First time through,"
            echo "follow docs/DEPLOY_CPANEL.md instead."
          } >> "$GITHUB_STEP_SUMMARY"
